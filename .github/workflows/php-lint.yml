name: PHP Syntax Check

on:
  push:
    branches:
      - main
      - feature/google-login-team-setup
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find admin includes scripts -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
